<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡册 · 全职猎人 148 集打卡</title>
<style>
  :root{
    --paper:#F7F4EE;--ink:#1A1A1A;--green:#2F7D4F;--green-d:#1E5636;--gold:#B08D3E;
    --line:#D8D2C4;--sub:#8A8578;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    background:var(--paper);color:var(--ink);
    font-family:Georgia,'Times New Roman','Noto Serif SC','Songti SC','STSong','SimSun',serif;
    line-height:1.7;-webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:760px;margin:0 auto;padding:0 24px;}
  header{padding:56px 0 24px;}
  .kicker{font-size:12px;letter-spacing:.22em;color:var(--sub);text-transform:uppercase;margin-bottom:20px;}
  .kicker b{color:var(--green);font-weight:normal;}
  h1{font-size:42px;font-weight:900;letter-spacing:.08em;margin-bottom:8px;}
  .hero-en{font-style:italic;font-size:18px;color:var(--green);margin-bottom:14px;}
  .sub{color:var(--sub);font-size:14px;}

  /* 猎人执照卡 */
  .license{
    margin:22px 0 30px;border-radius:14px;padding:18px 20px;color:#fff;
    background:linear-gradient(135deg,var(--green),var(--green-d));
    display:flex;justify-content:space-between;align-items:center;
    box-shadow:0 6px 18px rgba(47,125,79,.25);
  }
  .license .star{font-size:26px;letter-spacing:4px;line-height:1;}
  .license .name{font-size:15px;font-weight:900;letter-spacing:.24em;margin-top:2px;}
  .license .zh{font-size:11px;opacity:.8;letter-spacing:.3em;margin-top:2px;}
  .license .right{text-align:right;}
  .license .who{font-size:13px;opacity:.9;}
  .license .no{font-size:22px;font-weight:900;letter-spacing:.08em;white-space:nowrap;}
  .license .no small{font-size:11px;font-weight:normal;opacity:.75;}
  @media (max-width:480px){.license .no{font-size:18px;}}

  /* 漫画横幅 */
  figure.manga{margin:0 0 16px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;}
  figure.manga img{display:block;width:100%;height:auto;filter:grayscale(1) contrast(1.06);}
  
  figure.manga .cap{
    font-size:11px;letter-spacing:.2em;color:var(--sub);
    padding:7px 14px;border-top:1px solid var(--line);font-style:italic;
  }
  figure.manga .cap b{color:var(--green);font-weight:normal;}
  

  /* 统计 */
  .tally{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;}
  .tally .big{font-size:44px;font-weight:900;color:var(--green);line-height:1;}
  .tally .of{color:var(--sub);font-size:15px;}
  .bar{height:3px;background:var(--line);border-radius:2px;margin:6px 0 34px;}
  .bar i{display:block;height:100%;width:0;background:var(--green);border-radius:2px;transition:width .4s;}

  /* 篇章 */
  .arc{margin-bottom:30px;}
  .arc-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;}
  .badge{
    width:38px;height:38px;border-radius:50%;flex:none;
    border:1.5px solid var(--gold);color:var(--gold);
    display:flex;align-items:center;justify-content:center;
    font-size:17px;font-weight:900;transition:all .3s;
  }
  .badge.lit{background:var(--gold);color:#fff;box-shadow:0 0 0 3px rgba(176,141,62,.2);}
  .arc-title{font-size:19px;font-weight:900;letter-spacing:.04em;}
  .arc-range{font-size:12px;color:var(--sub);letter-spacing:.06em;}
  .arc-prog{margin-left:auto;font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums;}

  /* 名单 */
  .list{display:grid;grid-template-columns:1fr 1fr;gap:7px;}
  @media (max-width:600px){.list{grid-template-columns:1fr;}}
  .row{
    display:flex;align-items:center;gap:9px;width:100%;text-align:left;
    background:#fff;border:1px solid var(--line);border-radius:8px;
    padding:9px 12px;cursor:pointer;font-family:inherit;font-size:13.5px;color:var(--ink);
    transition:transform .12s;
  }
  .row:active{transform:scale(.97);}
  .row .no{
    font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--sub);
    letter-spacing:.05em;flex:none;min-width:26px;
  }
  .row .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .row.on{
    background:linear-gradient(135deg,var(--green),var(--green-d));
    border-color:var(--green-d);border-left:3px solid var(--gold);color:#fff;
  }
  .row.on .no{color:#F2D98B;}

  /* 页脚 */
  footer{padding:40px 0 60px;border-top:1px solid var(--line);margin-top:8px;}
  .nen{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px;}
  .nen span{
    font-size:11.5px;letter-spacing:.12em;color:var(--sub);
    border:1px solid var(--line);border-radius:999px;padding:3px 12px;
  }
  .mizumi{font-size:12.5px;color:var(--sub);margin-bottom:16px;}
  .reset{
    background:none;border:none;color:var(--sub);font-family:inherit;font-size:12px;
    text-decoration:underline;cursor:pointer;padding:0;
  }
</style>

const ARCS=[

  ["天空竞技场篇","塔",22,36,"HEAVEN'S ARENA — \"Bend it to my will!\"","arc1"],
  ["幻影旅团篇","蛛",37,58,"ZOLDYCK BROTHERS","arc2"],
  ["贪婪之岛篇","岛",59,75,"GREED ISLAND — GON FREEECS","arc3"],
  ["嵌合蚁篇","蚁",76,135,"NETERO × THE ANT KING","arc4"],
  ["会长选举篇","选",136,148,"YO. — ILLUMI & KILLUA","arc5"]
];
let state;
try{state=JSON.parse(localStorage.getItem(KEY))||{};}catch(e){state={};}

function buildAll(){
  const root=document.getElementById("arcs");
  root.innerHTML="";
  ARCS.forEach(a=>{
    const sec=document.createElement("section");
    sec.className="arc";
    let rows="";
    for(let e=a[2];e<=a[3];e++){
      const title=EP[e]||"";
      rows+='<button class="row'+(state[e]?" on":"")+'" data-e="'+e+'">'
          +'<span class="no">'+String(e).padStart(3,"0")+'</span>'
          +'<span class="t">'+title+'</span></button>';
    }
    const fig='<figure class="manga"><img src="'+IMG[a[5]]+'" alt="'+a[0]+'">'
      +'<figcaption class="cap">'+a[4]+'</figcaption></figure>';
    sec.innerHTML='<div class="arc-head">'
      +'<div class="badge">'+a[1]+'</div>'
      +'<div><div class="arc-title">'+a[0]+'</div>'
      +'<div class="arc-range">EP.'+String(a[2]).padStart(3,"0")+' — '+String(a[3]).padStart(3,"0")+'</div></div>'
      +'<div class="arc-prog" id="p'+a[2]+'"></div>'
      +'</div>'+fig+'<div class="list">'+rows+'</div>';
    root.appendChild(sec);
  });
  root.querySelectorAll(".row").forEach(b=>{
    b.onclick=()=>toggle(b);
  });
  checkArcs();
}
function toggle(b){
  const e=+b.dataset.e;
  state[e]=!state[e];
  localStorage.setItem(KEY,JSON.stringify(state));
  b.classList.toggle("on",state[e]);
  renderTally();checkArcs();
}
function checkArcs(){
  document.querySelectorAll(".arc").forEach((sec,i)=>{
    const a=ARCS[i];let full=true;
    for(let e=a[2];e<=a[3];e++)if(!state[e])full=false;
    sec.querySelector(".badge").classList.toggle("lit",full);
  });
  ARCS.forEach(a=>{
    let cnt=0;
    for(let e=a[2];e<=a[3];e++)if(state[e])cnt++;
    const p=document.getElementById("p"+a[2]);
    if(p)p.textContent=cnt+"/"+(a[3]-a[2]+1);
  });
}
function renderTally(){
  const n=Object.values(state).filter(Boolean).length;
  document.getElementById("seen").textContent=n;
  document.getElementById("barFill").style.width=(n/148*100)+"%";
}
function resetAll(){
  if(!confirm("整本卡册清空？这一步不后悔。"))return;
  state={};localStorage.setItem(KEY,"{}");buildAll();renderTally();
}
buildAll();renderTally();
